name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            packages/frontend/package-lock.json
            packages/backend/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@danwangdev'
      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: Install backend dependencies
        working-directory: packages/backend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: TypeScript check (frontend)
        working-directory: packages/frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: TypeScript check (backend)
        working-directory: packages/backend
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: packages/frontend
        continue-on-error: true
        run: npx eslint src/

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/backend/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@danwangdev'
      - name: Install dependencies
        working-directory: packages/backend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: Run tests
        working-directory: packages/backend
        run: npm test
      - name: Run coverage
        working-directory: packages/backend
        run: npm run test:coverage

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@danwangdev'
      - name: Install dependencies
        working-directory: packages/frontend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: Run tests
        working-directory: packages/frontend
        run: npm test
      - name: Run coverage
        working-directory: packages/frontend
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            packages/frontend/package-lock.json
            packages/backend/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@danwangdev'
      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: Build frontend
        working-directory: packages/frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: packages/backend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      - name: Build backend
        working-directory: packages/backend
        run: npm run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./packages/backend
          file: ./packages/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/vocab-master-backend:latest
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGE_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./packages/frontend
          file: ./packages/frontend/frontend.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NODE_AUTH_TOKEN=${{ secrets.GH_PACKAGE_TOKEN }}
            VITE_API_URL=/api
            VITE_OIDC_ISSUER=${{ vars.VITE_OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
          tags: ghcr.io/${{ github.repository_owner }}/vocab-master-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
