name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v6
      with:
        context: ./packages/backend
        file: ./packages/backend/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository_owner }}/vocab-master-backend:latest
        build-args: |
          NODE_AUTH_TOKEN=${{ secrets.NODE_AUTH_TOKEN }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend
      uses: docker/build-push-action@v6
      with:
        context: ./packages/frontend
        file: ./packages/frontend/frontend.Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          NODE_AUTH_TOKEN=${{ secrets.NODE_AUTH_TOKEN }}
          VITE_API_URL=/api
          VITE_OIDC_ISSUER=${{ vars.VITE_OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
        tags: ghcr.io/${{ github.repository_owner }}/vocab-master-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
