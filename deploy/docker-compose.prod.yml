version: '3.8'

services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-vocab-master}-frontend:latest
    container_name: vocab-master-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vocab-network

  backend:
    image: ${DOCKERHUB_USERNAME:-vocab-master}-backend:latest
    container_name: vocab-master-backend
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      - NODE_ENV=production
      - PORT=9876
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/data/vocab-master.db
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_INTERNAL_ISSUER=${OIDC_INTERNAL_ISSUER:-http://hub-app:3009}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-vocab-master-client}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
    volumes:
      - vocab-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9876/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vocab-network
      - hub

volumes:
  vocab-data:
    name: vocab-master-data

networks:
  vocab-network:
    name: vocab-master-network
  hub:
    external: true
    name: 11plus-hub_default
