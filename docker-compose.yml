services:
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: frontend.Dockerfile
      args:
        - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN:-}
        - VITE_API_URL=
        - VITE_OIDC_ISSUER=${VITE_OIDC_ISSUER:-http://localhost:3009}
        - VITE_OIDC_CLIENT_ID=${VITE_OIDC_CLIENT_ID:-vocab-master-client}
    container_name: vocab-master-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vocab-network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      args:
        - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN:-}
    container_name: vocab-master-backend
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      - NODE_ENV=production
      - PORT=9876
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_PATH=/data/vocab-master.db
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - OIDC_ISSUER=${OIDC_ISSUER:-http://localhost:3009}
      - OIDC_INTERNAL_ISSUER=${OIDC_INTERNAL_ISSUER:-http://hub-app:3009}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-vocab-master-client}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
    volumes:
      - vocab-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9876/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vocab-network
      - hub

  db-viewer:
    image: coleifer/sqlite-web
    container_name: vocab-master-db-viewer
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - vocab-data:/data
    command: sqlite_web -H 0.0.0.0 -p 8080 /data/vocab-master.db
    restart: unless-stopped
    networks:
      - vocab-network

volumes:
  vocab-data:
    name: vocab-master-data

networks:
  vocab-network:
    name: vocab-master-network
  hub:
    external: true
    name: 11plus-hub_default
